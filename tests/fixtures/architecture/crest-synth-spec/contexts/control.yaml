context: Control
purpose: the one-way application state, semantic events, and projections
ubiquitousLanguage:
  SemanticAction: one normalized user intent emitted by an input adapter or passive view
  SurfaceId: one stable graphical surface identity inside PATCH or MIXER, independent of layout placement
  FocusPath: the single reducer-owned semantic location of interaction
  ReturnPath: the exact stable origin restored when leaving a subordinate surface
  SemanticGraphicalViewModel: the immutable layout-neutral graphical projection consumed by every host
valueObjects:
  GraphicalShellProjection:
    description: the immutable host-neutral structural projection consumed by the production graphical
      window
    state:
      semantic: SemanticGraphicalViewModel
      contextLine: '{productLabel: String, contextLabel: String, statusLabel: String}'
      identityHeader: '{primaryLabel: String, secondaryLabel: String}'
      workspace: '{mainRegion: Patch | Mixer, mainLabel: String, sideRegion: Utility | Inspector, sideLabel:
        String, diagnostic: TextProjection}'
      footer: '{pathLabel: String, modeLabel: String, actionHints: Vec<String>, errorLabels: Vec<String>}'
      serializedLeafDescriptor: typed stable paths for every shell field and nested retained diagnostic
        field
    invariants:
    - semantic and the nested diagnostic projection come from one accepted AppState generation and state
      hash and cannot disagree
    - PATCH includes PatchMain and PatchUtility and MIXER includes MixerMain and MixerInspector without
      inventing a third context; identity derives from the semantic FocusPath and canonical state
    - status, error, identity, path, and mode labels are presentation values derived by StateProjector
      from semantic and contain no adapter, worker, graph, engine, mixer, device, or audio owner
    - actionHints are an exact presentation of semantic.validActions and never form a second hand-maintained
      input vocabulary
    - the value contains no pixel geometry, widget id, egui type, callback, mutable state, prepared object,
      device handle, or audio buffer
    contributesTo:
      graphical_application_shell: is the single immutable production-window projection for every structural
        shell region
      one_way_parameter_control: keeps the graphical adapter downstream of accepted state
      semantic_graphical_view_model: embeds one canonical interaction model and derives all path, mode,
        action, status, and error presentation from it
  PatchControlId:
    description: a stable semantic focus target inside the PATCH context
    from:
    - Engine
    - Envelope(VoiceEnvelopeParameter)
    - Capability(ParameterId)
    - Effect(EffectSlotId, ParameterId)
    - Output(PatchOutputParameter)
    invariants:
    - the base ordered surface is Engine followed by the four VoiceEnvelope surface-descriptor parameters
      Attack, Decay, Sustain, and Release exactly once; the focused Patch resolver appends each visible
      enabled active-instrument StructuralChoice ParameterId, then every ordered PostEffectConfig visible
      enabled ScalarEdit ParameterId exactly once
    - PatchUtility has a distinct ordered resolver containing Output(TrimGain) then Output(OutputTrack);
      those controls reuse the canonical PatchOutput descriptor and never enter the PatchMain order
    - Engine serializes as patch.engine, Envelope(parameter) derives patch.envelope.<VoiceEnvelopeParameter.name>,
      Capability(parameter) derives patch.capability.<ParameterId>, Effect(slotId, parameter) derives
      patch.effect.<EffectSlotId>.<ParameterId>, and Output(parameter) derives patch.output.<PatchOutputParameter.name>
      without declaring a second domain-field enum
    - the value is never a widget index, text line, capability id, display label, choice label, or platform
      input code
    contributesTo:
      schema_driven_patch_page: gives Engine and the four canonical ADSR rows stable ordered focus identities
      per_voice_envelope: reuses VoiceEnvelopeParameter rather than duplicating the four envelope concepts
        in control state
      asynchronous_engine_selection: lets the reducer resolve Edit+Left/Right without UI-owned focus
      soundfont_preset_selection: addresses the descriptor-owned preset row by the existing ParameterId
      static_patch_effect: addresses descriptor-owned effect scalars through stable slot and parameter
        identities
      sixteen_track_mixer_routing: addresses canonical Patch trim and output track in PATCH Utility
  EngineSelectionRequestId:
    description: a monotonic correlation identity for one structural instrument-config replacement attempt
    from: u64
    invariants:
    - zero denotes no request; accepted requests use a greater nonzero id and overflow is a typed unchanged
      rejection
    - the value is copyable and contains no clock, pointer, worker handle, graph, or destructor
    contributesTo:
      asynchronous_engine_selection: correlates reducer state, worker results, graph publication, activation,
        retirement, and trace evidence
      soundfont_preset_selection: shares the same request sequence and one-in-flight guard with engine
        selection
  EngineSelectionFailure:
    description: the stable visible control-side reason an engine candidate could not be prepared
    state:
      kind:
      - UnknownCapability
      - MissingDefault
      - InvalidDefaultConfig
      - ProviderMismatch
      - PreparerMissing
      - AssetUnavailable
      - PresetUnavailable
      - UnsupportedAudioConfig
      - PreparationFailed
      - GraphIncompatible
      - WorkerUnavailable
    invariants:
    - the value contains no adapter error string, path, engine, graph, decoder, allocation owner, or fallback
      choice
    - adapters map concrete errors to exactly one declared case outside the callback and retain diagnostic
      detail only outside canonical state
    contributesTo:
      asynchronous_engine_selection: makes failed preparation explicit, serializable, and recoverable
      soundfont_preset_selection: preserves an unavailable selected preset as a typed source-preserving
        failure
  EngineSelectionStatus:
    description: the reducer-owned one-in-flight structural lifecycle
    state:
      kind:
      - Ready
      - Preparing
      - Activating
      - Failed
      activeGraphRevision: GraphRevision
      correlation: 'Option<{requestId: EngineSelectionRequestId, patchId: PatchId, intent: StructuralEditIntent,
        sourceCapabilityId: CapabilityId, targetCapabilityId: CapabilityId, sourceGraphRevision: GraphRevision,
        targetGraphRevision: Option<GraphRevision>}>'
      failure: Option<EngineSelectionFailure>
    invariants:
    - activeGraphRevision is always nonzero; Ready has no correlation or failure, Preparing and Failed
      preserve the source revision, Activating keeps the source active while naming one newer target revision,
      and acknowledgement advances activeGraphRevision to that target before returning to Ready
    - Preparing has exact source correlation and no target revision; Activating has one nonzero target
      revision; Failed retains exact request correlation plus one typed failure while the active config
      and graph remain the source
    - at most one status is Preparing or Activating application-wide and only AppState.apply changes the
      status
    - the status contains no PreparedGraph, worker handle, channel, provider, preparer, asset data, UI
      object, or callback owner
    contributesTo:
      asynchronous_engine_selection: is the canonical pending, activation, and failure state
      schema_driven_patch_page: projects exact engine-row status without UI-owned lifecycle state
      soundfont_preset_selection: projects the same lifecycle on the targeted descriptor-owned preset
        row
  EngineSelectionEffect:
    description: the control-side structural effect emitted only after an accepted lifecycle transition
    state:
      kind:
      - PrepareRequested
      - CandidateCommitted
      - GraphStaged
      - GraphPublished
      - ActivationAcknowledged
      requestId: EngineSelectionRequestId
      patchId: PatchId
      intent: StructuralEditIntent
      sourceCapabilityId: CapabilityId
      targetCapabilityId: CapabilityId
      sourceGraphRevision: GraphRevision
      targetGraphRevision: Option<GraphRevision>
    invariants:
    - the effect contains stable control metadata only and never owns a PreparedGraph or adapter error
    - PrepareRequested names the active source revision and no target; candidate, staged, published, and
      acknowledged effects name the same newer target revision
    - EventRecord serializes every effect exactly once at the control transition or orchestration step
      that produced it
    contributesTo:
      asynchronous_engine_selection: makes structural orchestration observable without leaking graph ownership
        into AppState
      soundfont_preset_selection: records preset preparation, commit, publication, and acknowledgement
        without label matching
      observable_demo_scene: adds exact lifecycle effects to schema-derived coverage
  SemanticAction:
    description: the closed bounded user-intent union between physical/passive input and AppEvent
    state:
      kind:
      - SelectContext
      - Navigate
      - Adjust
      - SetInteractionMode
      - EnterSurface
      - Return
      payload:
      - TopLevelContext
      - Direction
      - InteractionMode
      - SurfaceId
      - none, according to kind
      surfaceDescriptor: typed exhaustive descriptors for every action and admitted payload
    invariants:
    - SelectContext, Navigate, and Adjust reuse TopLevelContext and Direction; SetInteractionMode carries
      Navigate or Adjust in Phase 2; EnterSurface carries one context-compatible side SurfaceId; Return
      has no payload
    - Modal and MultiSelect are named InteractionMode values but no Phase 2 SemanticAction can enter them
      until a later workflow defines its focus trap, exit, and valid-action rules
    - the value contains no raw key/button, widget, label, parameter value, AppState, engine, graph, audio
      buffer, device, or callback
    - AppLoop maps each user action to exactly one matching closed AppEvent before AppState.apply; startup,
      MIDI, worker, and system events do not masquerade as SemanticAction
    contributesTo:
      semantic_graphical_view_model: is both the passive view output and the exact valid-action vocabulary
      one_way_parameter_control: makes physical normalization and reducer input separate explicit stages
  StructuralEditIntent:
    description: the capability-neutral target of one app-wide prepared structural request
    state:
      kind:
      - ReplaceCapability
      - ReplaceParameterChoice
      targetCapabilityId: Option<CapabilityId>
      targetParameterId: Option<ParameterId>
      targetChoiceId: Option<String>
    invariants:
    - ReplaceCapability contains only one installed target CapabilityId and no parameter payload
    - ReplaceParameterChoice contains the active CapabilityId, one descriptor-declared StructuralChoice
      ParameterId, and one adjacent declared choice id
    - the intent contains no display label, prepared graph, worker, engine, asset contents, or callback
      owner
    - engine and preset selection use this one intent type, request counter, status, effect, and busy
      guard rather than parallel lifecycles
    contributesTo:
      asynchronous_engine_selection: retains adjacent installed-capability selection as one structural
        intent
      soundfont_preset_selection: addresses a preset change generically by ParameterId and stable choice
        id
  SurfaceId:
    description: the closed stable identity of the four Phase 2 graphical surfaces
    from:
    - PatchMain
    - PatchUtility
    - MixerMain
    - MixerInspector
    invariants:
    - PatchMain and PatchUtility belong only to PATCH; MixerMain and MixerInspector belong only to MIXER
    - the identity is invariant across desktop and Steam Deck composition and never encodes a pane index,
      rectangle, visibility shortcut, or egui id
    - PatchUtility owns the canonical Patch trim and output-track controls introduced by the corrective
      routing gate; MixerInspector owns selected-track sends and routed-Patch summary, and later visual
      work must reuse these identities rather than invent parallel surfaces
    contributesTo:
      semantic_graphical_view_model: lets more than one layout place the same canonical surface model
  InteractionMode:
    description: the explicit reducer-owned interaction interpretation projected to every host
    from:
    - Navigate
    - Adjust
    - Modal
    - MultiSelect
    invariants:
    - Navigate is the initial and focus-movement mode; Adjust is entered while Edit is held and leaves
      on release or physical focus loss
    - only Navigate and Adjust are reachable in Phase 2; Modal and MultiSelect remain unavailable until
      their later product workflows provide complete focus and exit contracts
    - the mode contains no color, key code, controller button, widget, or mutable view state
    contributesTo:
      semantic_graphical_view_model: makes cyan navigation and amber adjustment state explicit without
        letting the renderer infer input state
  MixerControlId:
    description: one stable semantic MIXER control identity
    from:
    - Track(MixerTrackId, MixerTrackParameter)
    - Global(GlobalParameter)
    invariants:
    - Track identity is one of the fixed sixteen MixerTrackIds and target identity comes from the canonical
      MixerTrackParameter descriptor; Global reuses the canonical GlobalParameter enum without becoming
      a seventeenth track
    - the value contains no PatchId, Patch parameter, parameter index, row, column, label, or widget identity
    contributesTo:
      semantic_graphical_view_model: preserves MIXER row meaning while horizontal navigation crosses fixed
        tracks
      sixteen_track_mixer_routing: prevents Patch identity or collection position from becoming mixer-channel
        focus
  SemanticControlId:
    description: one context-neutral stable control identity used by FocusPath
    from:
    - Patch(PatchControlId)
    - Mixer(MixerControlId)
    - SurfaceRoot
    invariants:
    - Patch reuses the existing descriptor-derived PatchControlId and Mixer reuses MixerControlId
    - SurfaceRoot remains available only for a side surface with no editable child; Patch Utility output
      controls and Mixer Inspector track sends use their canonical PatchControlId or MixerControlId instead
      of a fabricated surface value
    - the union contains no layout coordinate, collection index, display label, raw input, or value copy
    contributesTo:
      semantic_graphical_view_model: gives every active focus target one stable identity
  FocusPath:
    description: the canonical semantic location of exactly one focused target
    state:
      context: TopLevelContext
      surface: SurfaceId
      patchId: Option<PatchId>
      mixerTrackId: Option<MixerTrackId>
      capabilityId: Option<CapabilityId | EffectCapabilityId>
      controlId: SemanticControlId
      modalId: Option<String>
    invariants:
    - context and surface are compatible; Patch control paths carry the exact installed PatchId and descriptor
      capability identity where applicable, Mixer track paths carry one exact MixerTrackId, and Mixer
      Global paths omit both Patch and track identity
    - modalId is None throughout Phase 2 and is reserved only as the stable identity seam for a later
      specified modal workflow
    - the path resolves to exactly one current target through production descriptors and contains no collection
      index, layout coordinate, widget id, pointer, value, or presentation label
    contributesTo:
      semantic_graphical_view_model: keeps one focus identity coherent across reducer, projection, layout,
        live evidence, and schema recovery
      schema_driven_patch_page: reuses PatchControlId and descriptor identities instead of a second page
        focus
  ReturnPath:
    description: the exact origin captured before entering a subordinate persistent surface
    state:
      origin: FocusPath
      enteredSurface:
      - PatchUtility
      - MixerInspector
    invariants:
    - origin is a valid PatchMain or MixerMain path in the same TopLevelContext as enteredSurface
    - there is at most one ReturnPath in Phase 2; Return atomically restores origin, clears the path,
      and enters Navigate mode
    - a schema change repairs origin through the same deterministic focus resolver before it can be restored
    contributesTo:
      semantic_graphical_view_model: proves exact return without a view-owned navigation stack
  TopLevelContext:
    description: the only top-level product context selected through the reducer
    from:
    - Patch
    - Mixer
    invariants:
    - PATCH and MIXER are the complete closed set; the transitional diagnostic view is MIXER and no third
      text, utility, engine, or global context exists
    - the value is semantic application state and never a key code, window tab index, widget id, display
      label, or audio route
    contributesTo:
      schema_driven_patch_page: gives direct page selection one canonical semantic identity
  InteractionState:
    description: reducer-owned semantic focus, per-context memory, interaction mode, and subordinate-surface
      return retained independently from session and runtime state
    state:
      focusPath: FocusPath
      rememberedPatchPath: Option<FocusPath>
      rememberedMixerPath: FocusPath
      mode: InteractionMode
      returnPath: Option<ReturnPath>
    invariants:
    - initial focusPath and rememberedMixerPath identify MIXER Main Track T00 Level in Navigate mode,
      so exactly one semantic target exists before any Patch is installed
    - InstallPatches initializes rememberedPatchPath to the first accepted Patch's PatchMain Engine path
      and preserves the active MIXER path; no Patch vector index becomes focus identity
    - direct context selection saves the active root path, restores the destination context's remembered
      valid root path, clears returnPath, and enters Navigate mode
    - entering PatchUtility records the exact PatchMain origin and focuses Output(TrimGain); entering
      MixerInspector records the exact MixerMain track origin and focuses that track's ReverbSend; Return
      restores the origin, clears returnPath, and enters Navigate mode
    - main-surface paths resolve through the canonical PATCH or MIXER descriptor order; after schema/dependency
      change the reducer repairs active, remembered, and return paths through the one deterministic next-before-previous
      sibling rule
    - mode is Navigate or Adjust in Phase 2; Modal and MultiSelect remain typed but unreachable until
      their later workflow owns complete entry, trap, and exit behavior
    - the value contains no Patch/config copy, capability descriptor copy, engine, graph, parameter snapshot,
      UI widget, or device state
    contributesTo:
      one_way_parameter_control: keeps all semantic navigation inside the only reducer-owned interaction
        state
      schema_driven_patch_page: retains stable descriptor-derived PATCH focus independently from MIXER
        navigation
      semantic_graphical_view_model: is the canonical owner of focus, mode, context memory, and exact
        return
  AppEvent:
    description: the closed semantic input union accepted by AppState
    state:
      kind:
      - SelectContext
      - Navigate
      - Adjust
      - SetInteractionMode
      - EnterSurface
      - Return
      - InstallPatches
      - Midi
      - EnginePrepared
      - EnginePreparationFailed
      - EngineActivationAcknowledged
      payload: event-specific bounded payload
      surfaceDescriptor: typed exhaustive descriptors for every variant and Direction payload
    invariants:
    - SelectContext carries TopLevelContext
    - Navigate and Adjust carry Direction
    - SetInteractionMode carries InteractionMode and admits only Navigate or Adjust in Phase 2; EnterSurface
      carries SurfaceId; Return has no payload
    - InstallPatches is accepted only during startup on the control thread
    - Midi carries PatchId and MidiMessage
    - EnginePrepared carries stable request/Patch/StructuralEditIntent/capability/revision correlation
      plus one candidate InstrumentConfig but never a PreparedGraph; the historical variant name covers
      every prepared instrument-config replacement
    - EnginePreparationFailed carries the same correlation plus one typed EngineSelectionFailure and no
      adapter error string
    - EngineActivationAcknowledged carries requestId, target GraphRevision, retired GraphRevision, and
      collected=true from control ownership
    - raw key codes, window objects, clocks, files, and audio devices never appear in AppEvent
    - surfaceDescriptor is produced beside the closed enum and is the only exhaustive event source consumed
      by DemoScene; adding or removing a variant cannot compile or pass schema equality without updating
      the descriptor
    - surfaceDescriptor entries are unique before set conversion and enumerate SelectContext with both
      TopLevelContext values, Navigate and Adjust with all four Direction payloads, both admitted SetInteractionMode
      payloads, both context-compatible side surfaces, Return, InstallPatches and Midi, plus every correlated
      structural prepared, failed, and activation payload shape
    contributesTo:
      one_way_parameter_control: gives every input one semantic route into AppState
      schema_driven_patch_page: routes direct context selection through AppState.apply
      semantic_graphical_view_model: carries normalized user actions into the same reducer as every system
        event
  EventRecord:
    description: one deterministic control-side record of an input event, its reducer outcome, emitted
      effects, and coherent projections
    state:
      sequence: u64
      source:
      - Startup
      - Keyboard
      - AutomaticMidi
      - DemoScene
      - Worker
      - System
      input: stable tagged AppEvent representation including TopLevelContext, Direction, PatchId, MidiMessage,
        structural-edit intent/correlation, config, failure, and acknowledgement payloads when present
      outcome:
      - Accepted
      - Rejected
      rejection: Option<EventRejection>
      generationBefore: u64
      generationAfter: u64
      stateHashBefore: String
      stateHashAfter: String
      emittedEvents: Vec<stable tagged StateAccepted, audio-effect, or EngineSelectionEffect descriptors>
      parameterGeneration: u64
      projectionStateHash: String
      selectedLine: usize
      serializedLeafDescriptor: typed stable paths for every EventRecord field and tagged payload leaf
    invariants:
    - sequence is contiguous and strictly increasing within one EventLog
    - accepted records increment generation exactly once and their stateHashAfter, parameterGeneration,
      projectionStateHash, emitted StateAccepted generation, and emitted ParameterSnapshotPublished graphRevision
      agree with the canonical projections
    - rejected records keep generation and state hash identical and emit no parameter publication or audio
      command
    - records contain domain identifiers and bounded numeric payloads, never raw window objects, device
      handles, audio buffers, or nondeterministic timestamps
    - serializedLeafDescriptor is compared against the union of discriminating accepted and rejected EventRecords
      covering every input tag, Direction payload, MIDI payload, Patch installation capability/config
      field, rejection, and emitted-event tag; discovery from one convenient record is invalid
    contributesTo:
      observable_demo_scene: makes every input, reducer decision, and emitted effect machine-readable
        for debugging
  EventLog:
    description: a deterministic LLM-readable journal of control events and their state transition chain
    state:
      schemaVersion: u32
      totalObserved: u64
      droppedRecords: u64
      records: Vec<EventRecord>
      coverage: named expected, exercised, missing, and unexpected event/input/parameter/property identifiers
      serializedLeafDescriptor: typed stable paths for every EventLog and coverage field
    invariants:
    - normal interactive execution uses a bounded control-thread ring and reports any eviction instead
      of hiding it
    - the exhaustive demo pre-sizes the journal so droppedRecords is zero and retains every scene record
    - the hash/generation after one record equals the hash/generation before the next record
    - coverage is complete only when expected and exercised are exactly equal in both directions, so both
      missing and unexpected are empty
    - serialization is deterministic JSON with stable field and enum names suitable for LLM inspection
    contributesTo:
      observable_demo_scene: provides the complete event history and explicit coverage gaps
  StateTree:
    description: a canonical LLM-readable tree of the complete accepted control state and its current
      GUI/audio projections
    state:
      schemaVersion: u32
      generation: u64
      capabilities: Vec<CapabilityDescriptor>
      effectCapabilities: Vec<EffectCapabilityDescriptor>
      patches: 'Vec<{id, name, channel, instrument: {capabilityId, values: Vec<{parameterId, value}>,
        assetReferences: Vec<{parameterId, reference}>}, postEffects: Vec<{slotId, capabilityId, values:
        Vec<{parameterId, value}>, assetReferences: Vec<{parameterId, reference}>}>, envelope: {attackMilliseconds,
        decayMilliseconds, sustain, releaseMilliseconds}, output: {trackId, trimGainDb}}>'
      mixer: '{tracks: [MixerTrackParameters; 16]}'
      global: '{masterGainDb, reverbRoomSize, reverbDamping, reverbReturn, delayMilliseconds, delayFeedback,
        delayReturn}'
      interaction: '{focusPath, rememberedPatchPath, rememberedMixerPath, mode, returnPath}'
      engineSelection: EngineSelectionStatus
      patchPage: Option<PatchPageProjection>
      semanticGraphicalViewModel: SemanticGraphicalViewModel
      graphicalShell: GraphicalShellProjection
      projection: '{context, body, selectedLine, stateHash}'
      parameters: '{generation, graphRevision, patchCount, patches, postEffects, tracks, global}'
      serializedLeafDescriptor: typed stable paths derived beside the StateTree serializer
    invariants:
    - the tree contains every currently serialized CapabilityDescriptor, EffectCapabilityDescriptor, ParameterSpec,
      Patch, InstrumentConfig, PostEffectConfig, ParameterAssignment, AssetReference, VoiceEnvelope, PatchOutput,
      MixerTrackId, MixerTrackParameters, MixerState, GlobalParameters, InteractionState, FocusPath, ReturnPath,
      SemanticAction, EngineSelectionStatus, EngineSelectionFailure, PatchPageProjection, SemanticGraphicalViewModel,
      GraphicalShellProjection, TextProjection, and ParameterSnapshot property without an opaque debug-string
      substitute
    - capabilities exactly equal the installed CapabilityRegistry in stable order and every Patch InstrumentConfig
      resolves to exactly one listed descriptor
    - effectCapabilities exactly equal the installed EffectCapabilityRegistry in stable order and every
      PostEffectConfig resolves by stable capability and slot identity
    - patch order, PatchOutput values, all sixteen track entries, and every numeric value exactly match
      StateSnapshot and ParameterSnapshot
    - projection.context equals interaction.focusPath.context, semanticGraphicalViewModel.focusPath equals
      interaction.focusPath, projection.stateHash equals the canonical StateSnapshot hash, parameters.generation
      equals generation, and parameters.graphRevision equals the target PreparedGraph revision
    - patchPage is present exactly in PATCH context and exactly equals the projector's focused PatchPageProjection;
      it is absent in MIXER context
    - semanticGraphicalViewModel exactly equals the projector's semantic model for this generation; graphicalShell
      embeds that exact value plus the same nested diagnostic projection and contains no parallel interaction
      state
    - serialization is deterministic JSON with a version field and stable property names
    - serializedLeafDescriptor exactly equals recursively discovered JSON leaf paths in both directions
      for a discriminating multi-Patch tree
    contributesTo:
      instrument_capability_model: exposes the installed descriptors and generic Patch configs as exact
        canonical data
      static_patch_effect: exposes the effect registry, ordered Patch configs, focused rows, and fixed
        scalar projection as exact canonical data
      observable_demo_scene: exposes the complete state/projection tree for LLM observation and diagnosis
      semantic_graphical_view_model: serializes the exact semantic interaction and multi-layout projection
        beside the canonical state
      sixteen_track_mixer_routing: serializes every Patch route/trim and all sixteen tracks beside the
        fixed audio projection
  StateSnapshot:
    description: canonical serialized control state
    state:
      json: String
      hash: String
    invariants:
    - JSON contains the complete installed instrument and effect registries, every Patch InstrumentConfig,
      ordered PostEffectConfig, asset reference, VoiceEnvelope, PatchOutput, the complete sixteen-entry
      MixerState, GlobalParameters, InteractionState, and EngineSelectionStatus including any typed failure
    - decode(encode(state)) equals state
    - a MIDI-only accepted generation may share the immutable canonical JSON suffix and defer full String
      materialization, but requested JSON and its hash exactly equal eager serialization of the same AppState
    contributesTo:
      one_way_parameter_control: makes accepted state serialization explicit and testable
  PatchPageProjection:
    description: the immutable host-neutral PATCH view model for one stable focused Patch
    state:
      context: Patch
      patch: '{id: PatchId, name: String, midiChannel: MidiChannel}'
      output: '{trimControlId: PatchControlId, trimGainDb: f32, trackControlId: PatchControlId, trackId:
        MixerTrackId, trackChoices: [MixerTrackId; 16]}'
      focusedControlId: PatchControlId
      engine: '{controlId: PatchControlId, activeCapabilityId: CapabilityId, activeLabel: String, choices:
        Vec<{capabilityId: CapabilityId, label: String}>, status: Ready | Preparing | Activating | Failed,
        activeGraphRevision: GraphRevision, requestedCapabilityId: Option<CapabilityId>, requestId: Option<EngineSelectionRequestId>,
        targetGraphRevision: Option<GraphRevision>, failure: Option<EngineSelectionFailure>, editable:
        bool}'
      envelope: 'Vec<{controlId: PatchControlId, id: stable VoiceEnvelopeParameter id, label: String,
        value: f32, minimum: f32, maximum: f32, fineStep: f32, coarseStep: f32, unit: Option<String>,
        editable: true}>'
      sections: 'Vec<{id: stable instrument descriptor section id, label: String, parameters: Vec<{controlId:
        Option<PatchControlId>, id: ParameterId, label: String, kind, update, patchInteraction, value:
        ParameterValue | AssetReference, choices: Vec<{id, label}>, requestedChoiceId: Option<String>,
        status: Option<Ready | Preparing | Activating | Failed>, requestId: Option<EngineSelectionRequestId>,
        targetGraphRevision: Option<GraphRevision>, failure: Option<EngineSelectionFailure>, unit: Option<String>,
        enabled: bool, visible: bool, editable: bool}>}>'
      effects: 'Vec<{slotId: EffectSlotId, capabilityId: EffectCapabilityId, label: String, editableIdentity:
        false, sections: Vec<{id, label, parameters: Vec<{controlId: Option<PatchControlId>, id: ParameterId,
        label: String, kind, update, patchInteraction, value: ParameterValue | AssetReference, choices:
        Vec<{id, label}>, unit: Option<String>, enabled: bool, visible: bool, editable: bool}>}>}>'
      stateHash: String
      serializedLeafDescriptor: typed stable paths for every Patch-page field and row variant
    invariants:
    - patch resolves the active or remembered PatchMain FocusPath by stable PatchId and copies identity,
      name, and MIDI channel from that exact canonical Patch
    - output copies the exact canonical PatchOutput, derives Output(TrimGain) and Output(OutputTrack)
      ids from the shared descriptor, and lists all sixteen MixerTrackIds without a track-state copy
    - focusedControlId is the PatchControlId carried by the canonical PatchMain FocusPath; engine active
      identity and label resolve from the Patch InstrumentConfig and installed CapabilityRegistry; choices
      contain every registry entry exactly once in registry order and engine.controlId is Engine
    - status, activeGraphRevision, requestId, targetGraphRevision, intent, and failure are exact projections
      of EngineSelectionStatus; active capability or preset choice changes only at the accepted EnginePrepared
      commit while activeGraphRevision advances only at acknowledgement
    - engine editable is true only when the focused Patch exists, at least two installed choices exist,
      and status is Ready or Failed; Preparing and Activating remain visible but disabled without changing
      focus
    - envelope contains exactly Attack, Decay, Sustain, and Release from the canonical Patch VoiceEnvelope
      descriptor in stable order; each row derives controlId from the same VoiceEnvelopeParameter, is
      editable in every lifecycle status, and owns no second envelope state
    - sections and parameters exactly preserve the active CapabilityDescriptor order, stable ids, labels,
      kinds, update classes, patch interactions, choices, units, dependency visibility/enabled results,
      and canonical InstrumentConfig values or assets; only visible enabled StructuralChoice fields receive
      Capability(ParameterId), adjacent-choice metadata, and structural editability
    - effects exactly preserve Patch PostEffectConfig order and stable slot identity, resolve each EffectCapabilityDescriptor
      generically, show effect identity read-only, and give only visible enabled ScalarEdit parameters
      Effect(slotId, ParameterId) control ids and scalar editability
    - the targeted engine or capability row projects active and requested identity, Preparing/Activating/Failed
      status, request/revision correlation, and failure while every other structural row remains inactive;
      Ready has no pending target
    - projection walks instrument and effect descriptors generically and contains no SoundFont, Braids,
      Chorus, preset, bank, program, percussion, Model, Timbre, Color, Amount, or Depth field list or
      capability-id branch
    - stateHash equals the StateSnapshot hash for the accepted InteractionState and session values used
      to create the page
    contributesTo:
      instrument_capability_model: projects active instrument configuration through its owning descriptor
      schema_driven_patch_page: is the canonical PATCH page data with one structural engine row, four
        scalar ADSR rows, and descriptor-declared structural-choice rows under one focus identity
      per_voice_envelope: projects editable rows directly from canonical VoiceEnvelope state and descriptors
      asynchronous_engine_selection: projects active/requested identity and exact lifecycle without owning
        worker or graph state
      soundfont_preset_selection: projects the exact authored preset label, ordered choices, focus, request
        status, and typed failure from the generic descriptor/config/lifecycle
      static_patch_effect: projects the read-only Chorus identity and editable Amount/Depth rows from
        canonical effect descriptor/config state
      sixteen_track_mixer_routing: supplies PATCH Utility with canonical trim and output-track data
  TextProjection:
    description: the retained lossless diagnostic text body derived from StateSnapshot and its reducer-owned
      context projection
    state:
      context: TopLevelContext
      body: String
      selectedLine: usize
      stateHash: String
      serializedLeafDescriptor:
      - context
      - body
      - selectedLine
      - stateHash
    invariants:
    - context exactly equals InteractionState.focusPath.context and the body begins with its semantic
      PATCH or MIXER identity plus the direct 1/2 page bindings
    - in MIXER, tracks T00 through T0F each appear once in stable MixerTrackId order with exact level,
      pan, mute, solo, reverb send, delay send, and routed Patch identities; no Patch becomes a mixer
      column, empty tracks remain present, and a distinct final GLOBAL section retains all seven values
    - in PATCH, the body is a lossless deterministic rendering of PatchPageProjection including Patch
      identity, MIDI channel, active/requested structural target, Ready/Preparing/Activating/Failed status,
      typed failure, installed engine and parameter choices, ADSR, every instrument descriptor field,
      and every ordered read-only effect identity plus effect field with its stable slot/parameter id
      and editability status
    - the text projector contains no SoundFont/Braids capability-id branch or duplicate engine-specific
      field list
    - the line matching focusedControlId begins with > even when the focused structural action is temporarily
      disabled; every other parameter line begins with one space and selectedLine names the marked line
    - stateHash equals the StateSnapshot hash used to create the body
    contributesTo:
      one_way_parameter_control: provides a retained immutable active-context diagnostic downstream of
        accepted state
      schema_driven_patch_page: preserves a lossless host-neutral PATCH diagnostic inside the graphical
        shell
      sixteen_track_mixer_routing: renders the fixed track bank and routes without reconstructing mixer
        state from Patches
  ValidAction:
    description: one currently accepted SemanticAction and its host-neutral presentation metadata
    state:
      action: SemanticAction
      label: String
      hint: Option<String>
    invariants:
    - action is accepted for the exact projected focus, mode, dependency state, value boundary, and structural
      lifecycle at projection time
    - labels and hints are presentation only; the action value, not its string, is emitted by a passive
      component
    - a projected list is ordered and duplicate-free and excludes unavailable directions, unavailable
      modes, invalid surfaces, and blocked structural edits
    contributesTo:
      semantic_graphical_view_model: is the single source for footer hints and passive component intents
  SemanticControlViewModel:
    description: one immutable focusable or read-only control projected without layout or widget types
    state:
      path: FocusPath
      label: String
      kind:
      - continuous
      - stepped
      - choice
      - toggle
      - asset
      - identity
      - surface
      value: typed canonical value or read-only presentation
      unit: Option<String>
      enabled: bool
      visible: bool
      editable: bool
      focused: bool
      status: Option<Ready | Preparing | Activating | Failed>
      error: Option<typed stable error projection>
    invariants:
    - parameter kind, label, value, unit, dependency state, editability, status, and failure come from
      canonical state plus the owning instrument/effect/mixer descriptor
    - focused is true for exactly the node whose path equals SemanticGraphicalViewModel.focusPath; read-only
      and disabled nodes never enter the focus resolver
    - the value contains no egui type, geometry, callback, mutable state, engine/effect branch, prepared
      object, device, or audio buffer
    contributesTo:
      semantic_graphical_view_model: gives multiple layouts the same schema-derived control content
  SemanticSurfaceViewModel:
    description: one immutable semantic surface independent of where a host places it
    state:
      id: SurfaceId
      label: String
      role:
      - Main
      - PersistentSide
      controls: Vec<SemanticControlViewModel>
      summary: typed read-only canonical summary
    invariants:
    - PATCH exposes PatchMain plus PatchUtility and MIXER exposes MixerMain plus MixerInspector; no third
      top-level context exists
    - main controls use canonical descriptor order; PatchUtility projects Patch trim and output track,
      MixerInspector projects the selected track's sends and routed-Patch summary, and neither side surface
      owns a second value copy
    - surface order and identities are stable while host layout order, density, wrapping, and rectangle
      placement remain adapter concerns
    contributesTo:
      semantic_graphical_view_model: lets desktop and Steam Deck compositions render the same semantic
        content
  SemanticGraphicalViewModel:
    description: the canonical immutable host-neutral graphical interaction projection
    state:
      generation: u64
      stateHash: String
      context: TopLevelContext
      activeSurface: SurfaceId
      focusPath: FocusPath
      interactionMode: InteractionMode
      returnPath: Option<ReturnPath>
      validActions: Vec<ValidAction>
      status: '{kind: Ready | Preparing | Activating | Failed, label: String, requestId: Option<EngineSelectionRequestId>,
        graphRevision: GraphRevision}'
      errors: 'Vec<{code: stable typed code, label: String, sourcePath: Option<FocusPath>} >'
      surfaces: Vec<SemanticSurfaceViewModel>
      serializedLeafDescriptor: typed stable paths for every semantic view-model field and variant
    invariants:
    - all fields derive from one accepted AppState and StateSnapshot generation; context equals focusPath.context,
      activeSurface equals focusPath.surface, and exactly one visible enabled control path equals focusPath
    - PATCH surfaces resolve instrument, effect, and PatchOutput content only through installed descriptors
      and PatchControlId; MIXER always resolves all sixteen tracks through MixerTrackId and MixerTrackParameter
      plus separate canonical globals and never derives columns from Patches
    - validActions is computed by the same pure resolver used before reducer execution, status and errors
      project only typed canonical runtime lifecycle values, and a healthy state contains an explicit
      empty errors vector
    - the model contains no eframe/egui type, viewport, rectangle, density rule, widget id, raw input,
      callback, AppState reference, mutable value, prepared object, device handle, or audio buffer
    - GraphicalShellProjection embeds this value and derives its path/status/footer presentation from
      it; the shell and retained TextProjection never own parallel interaction state
    contributesTo:
      semantic_graphical_view_model: is the single multi-layout graphical interaction contract
      graphical_application_shell: supplies canonical surface, path, status, error, and footer data to
        the passive shell
      sixteen_track_mixer_routing: projects the fixed track bank and PATCH output controls without UI-owned
        routing state
aggregates:
  AppState:
    root: true
    purpose: own immutable instrument/effect registries, installed Patches, the fixed sixteen-track mixer,
      global parameters, interaction state, one structural-edit runtime status, and accepted generation
    state:
      capabilities: CapabilityRegistry
      effectCapabilities: EffectCapabilityRegistry
      patches: Vec<Patch>
      mixer: MixerState
      global: GlobalParameters
      interaction: InteractionState
      engineSelection: EngineSelectionStatus
      generation: u64
    commands:
      Apply:
        event: AppEvent
    events:
      StateAccepted:
        generation: u64
    invariants:
    - Apply is the only mutation method
    - CapabilityRegistry is supplied at construction, remains immutable, and the current increment contains
      exactly instrument.soundfont.hidef and instrument.braids
    - EffectCapabilityRegistry is supplied at construction, remains immutable, and the current increment
      contains exactly effect.chorus
    - 'SelectContext changes only InteractionState: it stores the active root FocusPath, restores the
      destination remembered root path, clears ReturnPath, enters Navigate, emits no AudioCommand, and
      requires an installed valid remembered PATCH path before selecting PATCH'
    - in MIXER Main Navigate changes only the stable MixerControlId inside FocusPath; Up/Down moves Level,
      Pan, Mute, Solo and Left/Right moves between MixerTrackIds T00 through T0F while preserving the
      row without consulting Patch count or schema
    - in MIXER Main Adjust requires Adjust mode, resolves MixerControlId to the exact MixerTrackParameter
      or distinct GlobalParameter, and transactionally changes only that canonical value through its owning
      descriptor
    - in PATCH Main Navigate requires Navigate mode; Up/Down moves one step through the focused Patch
      resolver's nonwrapping Engine, Attack, Decay, Sustain, Release, visible instrument StructuralChoice
      order, then ordered visible effect ScalarEdit order; Right enters PatchUtility with an exact ReturnPath
      and Left is unavailable; Left or Return from PatchUtility restores the main origin
    - EnterSurface from PatchMain records that exact FocusPath as ReturnPath and focuses PatchUtility
      Output(TrimGain); EnterSurface from MixerMain records the exact track path and focuses MixerInspector
      ReverbSend for that MixerTrackId; Return restores the origin and clears the path
    - in PATCH Utility Navigate moves nonwrapping between Output(TrimGain) and Output(OutputTrack); Adjust
      applies canonical trim steps or adjacent nonwrapping MixerTrackId changes to exactly the focused
      Patch through AppState.apply and emits only a latest parameter snapshot
    - in MIXER Inspector Navigate moves nonwrapping between the selected track's ReverbSend and DelaySend
      plus distinct global controls; Adjust changes only the resolved track send or global value and never
      a Patch-owned value
    - SetInteractionMode accepts Navigate or Adjust only when the current target supports the transition,
      K release and focus loss restore Navigate, and every Navigate or Adjust event is rejected unchanged
      when its mode does not match
    - in PATCH, Adjust Left/Right on Engine resolves the adjacent nonwrapping registry capability and
      accepts one PrepareRequested transition, while Adjust Up/Down on Engine is ActionUnavailableInContext
    - 'in PATCH, Adjust on Envelope(parameter) reuses the canonical VoiceEnvelope descriptor and mutation
      path: Left/Right is fine decrement/increment, Down/Up is coarse decrement/increment, and exactly
      that focused Patch envelope field changes'
    - in PATCH, Adjust Left/Right on Capability(parameter) validates that the active descriptor marks
      it StructuralChoice, resolves the adjacent nonwrapping declared choice, and requests a candidate
      changing only that assignment; Adjust Up/Down is ActionUnavailableInContext and a choice endpoint
      is ParameterAtBoundary
    - 'in PATCH, Adjust on Effect(slotId, parameter) resolves the exact Patch PostEffectConfig and EffectCapabilityDescriptor
      ScalarEdit row: Left/Right is fine decrement/increment and Down/Up is coarse decrement/increment,
      exactly that value changes, and no structural effect, AudioCommand, or fallback is emitted'
    - an accepted engine or capability-choice request allocates the next nonzero EngineSelectionRequestId,
      records one StructuralEditIntent, enters Preparing, emits exactly one EngineSelectionEffect::PrepareRequested,
      and leaves every Patch InstrumentConfig plus the active GraphRevision unchanged
    - while Preparing or Activating another PATCH structural Adjust is StructuralEditBusy and unchanged;
      MIDI, SelectContext, semantic focus Navigate, surface/Return navigation, and valid scalar Adjust
      events from MIXER or PATCH ADSR retain their normal behavior
    - a correlated EnginePreparationFailed transition enters Failed with its typed visible failure and
      preserves every Patch config, PatchOutput, complete MixerState, graph revision, parameter, and unrelated
      state; Failed may accept a later adjacent request
    - a correlated EnginePrepared transition revalidates the candidate config against StructuralEditIntent,
      changes only the requested Patch InstrumentConfig and only the permitted capability or single structural
      assignment, enters Activating with the target GraphRevision, and preserves Patch identity, MIDI
      channel, envelope, PatchOutput, complete MixerState, every unrelated Patch, and all accepted scalar
      edits made while preparing
    - EngineActivationAcknowledged reaches Ready only when request id, target active revision, retired
      source revision, and control-side collection all match; early, duplicate, stale, or mismatched worker
      and acknowledgement events are typed unchanged rejections
    - Adjust toward a boundary when the selected value is already at that boundary is rejected as ParameterAtBoundary
      and leaves state identical
    - Adjust Left/Right is the fine decrement/increment and Adjust Down/Up is the coarse decrement/increment
    - after any committed descriptor, dependency, or structural change, active, remembered, and return
      FocusPaths retain an exact still-valid stable target or recover by searching the prior ordered surface
      outward with next-before-previous tie breaking while skipping hidden and disabled nodes; the view
      and adapter never repair focus
    - InstallPatches preserves supplied order, rejects duplicate MidiChannels, more than the prepared
      Patch capacity, invalid PatchOutput track/trim, instrument or effect capability/config/asset/slot
      identities, duplicate ParameterIds, or more than one post effect per Patch, initializes rememberedPatchPath
      to the first accepted PatchMain Engine path, preserves all sixteen existing tracks, and is rejected
      after startup; the production composition separately supplies deterministic output routes and exactly
      one effect.chorus slot on its first fixture Patch
    - Midi validates its Patch target read-only, preserves the exact CapabilityRegistry and Patch storage,
      changes only generation, and yields one AudioCommand effect after state acceptance
    - every accepted event increments generation once and every rejected event leaves state identical
    meta:
      rules:
      - publish one typed EventRejection descriptor beside the enum with a unique stable name and reachability
        of Scene or ReducerTable
      - classify InstallationClosed, TooManyPatches, DuplicateMidiChannel, InvalidInstrumentConfig, InvalidEffectConfig,
        UnknownPatch, ParameterAtBoundary, ActionUnavailableInContext, EngineSelectionUnavailable, StructuralEditBusy,
        StaleEngineSelection, and MismatchedEngineSelection as externally constructible; classify NoPatchesInstalled,
        InvalidSelection, InvalidParameterValue, RequestIdOverflow, and GenerationOverflow as controlled
        reducer-table cases
      - the exact descriptor set must equal the enum set before scene/table partitioning, and each variant
        is asserted by exactly one declared test path
    contributesTo:
      instrument_capability_model: validates every installed Patch against one immutable descriptor registry
        through the canonical reducer
      one_way_parameter_control: is the single source of mutable control state
      schema_driven_patch_page: owns page context and stable Patch focus without moving state into the
        UI
      asynchronous_engine_selection: owns every request, failure, candidate commit, and activation transition
        while prepared graph ownership stays external
      soundfont_preset_selection: owns preset intent, boundary, source-preserving pending state, exact
        single-assignment commit, and failure through the same reducer
      static_patch_effect: owns canonical effect config installation and Amount/Depth scalar mutation
        through the same reducer
      semantic_graphical_view_model: owns the only semantic focus, mode, return, surface transition, and
        recovery state
      sixteen_track_mixer_routing: owns Patch output edits and track state behind the single reducer
domainServices:
  StateProjector:
    purpose: derive serialization, the semantic graphical view model, diagnostic text, graphical shell,
      fixed real-time parameters, and canonical observation tree from one accepted AppState
    uses:
    - AppState
    - CapabilityRegistry
    - CapabilityDescriptor
    - InstrumentConfig
    - EffectCapabilityRegistry
    - EffectCapabilityDescriptor
    - PostEffectConfig
    - MixerTrackId
    - PatchOutput
    - MixerTrackParameter
    - MixerTrackParameters
    - MixerState
    - StateSnapshot
    - InteractionState
    - FocusPath
    - ValidAction
    - SemanticGraphicalViewModel
    - EngineSelectionStatus
    - EngineSelectionFailure
    - PatchPageProjection
    - GraphicalShellProjection
    - TextProjection
    - StateTree
    - ParameterSnapshot
    - GraphRevision
    meta:
      rules:
      - construct one canonical borrowed serialized-state view per eager projection, serialize AppState
        deterministically with serde_json, and verify round-trip identity in tests rather than deserializing
        Crest's own JSON on the production dispatch path
      - derive InteractionState, PatchPageProjection, SemanticGraphicalViewModel, TextProjection, and
        GraphicalShellProjection only from the accepted StateSnapshot; resolve both context bodies from
        FocusPath and typed descriptors without positional or capability-specific matching
      - 'derive ordered visible/enabled focus resolvers per surface: PatchMain uses Engine, VoiceEnvelope,
        instrument StructuralChoice, and ordered effect ScalarEdit identities; PatchUtility uses PatchOutputParameter;
        MixerMain uses all sixteen MixerTrackIds crossed with Level, Pan, Mute, and Solo; MixerInspector
        uses the selected track''s ReverbSend and DelaySend plus distinct GlobalParameter identities;
        reducer navigation, focus recovery, valid actions, projection, coverage, and demos share these
        exact resolvers'
      - derive SemanticGraphicalViewModel from that same generation, FocusPath, InteractionMode, ReturnPath,
        descriptors, canonical values, EngineSelectionStatus, and typed failures; every valid action must
        pass the same pure precondition used by AppState.apply
      - derive GraphicalShellProjection by embedding that exact SemanticGraphicalViewModel plus the retained
        TextProjection; project every structural label, current path, status/error presentation, and footer
        valid-action hint here and never in the eframe adapter
      - derive PatchPageProjection from the active or remembered PatchMain path, PatchControlId, VoiceEnvelope
        descriptor, active CapabilityDescriptor, InstrumentConfig, EngineSelectionStatus, and complete
        installed registry; use stable ids and descriptor order and never match on SoundFont or Braids
      - copy every PatchOutput and envelope value plus at most sixteen descriptor-ordered Scalar engine
        values and a separate zero-or-one fixed effect slot with at most eight descriptor-ordered Scalar
        values per Patch, exactly sixteen MixerTrackParameters entries, every global value, and the caller-owned
        target GraphRevision into ParameterSnapshot; reject Patch, slot, scalar, or route capacity mismatch
      - derive StateTree from the exact same StateSnapshot, PatchPageProjection, GraphicalShellProjection,
        TextProjection, and ParameterSnapshot without reading or mutating any second state copy
      - when accepted Midi changes only generation, share the prior immutable state suffix, text body,
        and StateTree template; advance snapshot, text, fixed parameters, and tree coherently and materialize
        large JSON only on observation
      - force generation-only snapshot and tree JSON to materialize in equivalence tests and require byte-for-byte
        equality with an eager projection from the same accepted AppState
      - for a discriminating projection, compare every installed capability/parameter descriptor including
        patchInteraction and authored choice labels, Patch identity, MIDI channel, InstrumentConfig value/asset,
        envelope and PatchOutput value/descriptor, all sixteen track values, global value, FocusPath,
        mode, return path, valid action, status/error, structural intent, engine/preset choice, selection
        marker, selectedLine, and stateHash exactly against accepted state; nonempty text or mere property
        presence is not sufficient
      - publish production-owned typed surface/leaf descriptors beside their enum or serializer and require
        exact equality with recursively discovered EventLog, EventRecord, StateTree, SemanticGraphicalViewModel,
        GraphicalShellProjection, TextProjection, and ParameterSnapshot paths
    contributesTo:
      instrument_capability_model: derives generic descriptor/config serialization and text from one accepted
        state
      one_way_parameter_control: keeps text and audio projections consistent with serialized accepted
        state
      schema_driven_patch_page: derives the PATCH view model and text from canonical state and installed
        descriptors
      asynchronous_engine_selection: projects every lifecycle generation and candidate scalar layout from
        committed canonical state
      soundfont_preset_selection: derives the authored-name preset row, dynamic focus, requested choice,
        and structural lifecycle generically from catalog-backed schema
      static_patch_effect: derives effect registry/config serialization, PATCH rows, stable focus, and
        fixed effect scalar slots without processor branches
      realtime_execution: converts control-owned collections into bounded callback values
      observable_demo_scene: builds the canonical complete tree from one coherent accepted generation
      semantic_graphical_view_model: derives one exact multi-layout interaction projection and its valid
        actions from canonical state
      sixteen_track_mixer_routing: projects fixed track controls and Patch outputs into semantic, diagnostic,
        state-tree, and real-time forms
applicationServices:
  AppLoop:
    purpose: map normalized user actions to AppEvents, apply every event, and publish only effects derived
      from accepted state
    uses:
    - AppState
    - StateProjector
    - SemanticAction
    - SemanticGraphicalViewModel
    - AudioBoundary
    - GraphRevision
    - GraphPreparationWorker
    - DescriptorDefaultConfigFactory
    - StructuralGraphCoordinator
    - EngineSelectionEffect
    - EventRecord
    - EventLog
    - StateTree
    operations:
      dispatchAction:
        input:
          source: EventSource
          action: SemanticAction
        output:
          result: Result<DispatchResult, EventRejection>
      dispatch:
        input:
          event: AppEvent
        output:
          result: Result<DispatchResult, EventRejection>
      dispatchFrom:
        input:
          source: EventSource
          event: AppEvent
        output:
          result: Result<DispatchResult, EventRejection>
      currentGraphicalShell:
        input: {}
        output:
          projection: GraphicalShellProjection
      currentSemanticGraphicalViewModel:
        input: {}
        output:
          projection: SemanticGraphicalViewModel
      currentText:
        input: {}
        output:
          projection: TextProjection
      currentPatchPage:
        input: {}
        output:
          projection: Option<PatchPageProjection>
      currentStateTree:
        input: {}
        output:
          state: StateTree
      eventLog:
        input: {}
        output:
          events: EventLog
      advanceStructural:
        input: {}
        output:
          result: Result<StructuralProgress, ApplicationError>
    meta:
      rules:
      - construction receives the nonzero revision of the complete initial graph and initializes EngineSelectionStatus.activeGraphRevision;
        later revisions advance only through correlated prepared and acknowledgement events and never
        become a second mutable Patch config
      - dispatchAction maps exactly one SemanticAction to its matching closed AppEvent, records the physical/passive
        source, and delegates to the same dispatch path; system, startup, worker, and MIDI callers retain
        direct typed AppEvent dispatch
      - dispatch order is reduce AppEvent through AppState.apply, commit accepted AppState, derive StateSnapshot/PatchPageProjection
        when active/SemanticGraphicalViewModel/TextProjection/GraphicalShellProjection/ParameterSnapshot
        tagged with the target GraphRevision, publish parameters, then enqueue any AudioCommand
      - an accepted SelectContext publishes a generation-coherent ParameterSnapshot with identical parameter
        values and GraphRevision, publishes no AudioCommand or structural request, and changes no prepared
        or rendered state
      - an accepted focus Navigate, SetInteractionMode, EnterSurface, or Return publishes generation-coherent
        logical projections and a same-revision ParameterSnapshot with identical values, emits no AudioCommand
        or EngineSelectionEffect, and changes no Patch, track, graph, engine, mixer, or audio behavior
      - an accepted PatchOutput or MixerTrackParameter Adjust commits exactly the resolved Patch trim/route
        or track field before projection, publishes the complete same-graph-revision fixed snapshot, emits
        no AudioCommand or structural request, and reaches MixEngine on the next compatible read
      - an accepted PATCH ADSR Adjust commits one VoiceEnvelope field before projection, publishes the
        complete same-graph-revision fixed ParameterSnapshot, emits no AudioCommand, preparation request,
        or structural ownership, and lets the renderer consume the value through the existing per-voice
        envelope seam
      - an accepted PATCH effect ScalarEdit commits one PostEffectConfig assignment before projection,
        publishes the complete same-graph-revision fixed ParameterSnapshot, emits no AudioCommand, preparation
        request, or structural ownership, and lets the prepared effect rack consume the matching slot
        value
      - after an accepted PATCH structural request, use StructuralEditIntent to build either the descriptor-default
        engine candidate or the active config with exactly one adjacent StructuralChoice assignment through
        the installed provider, revalidate it against the immutable registry, and trySubmit it exactly
        once; WorkerBusy after reducer acceptance is a retained typed application fault and never causes
        fallback or a hidden second queue
      - advanceStructural polls at most one worker result and graph status per control tick, maps only
        stable semantic payloads into AppEvents, and routes every lifecycle mutation back through AppState.apply
        with EventSource::Worker
      - for a prepared result, first correlate intent and retain graph ownership, dispatch EnginePrepared,
        commit only its permitted candidate config delta plus any required deterministic FocusPath repair,
        derive the exact target-revision StateSnapshot/PatchPageProjection/SemanticGraphicalViewModel/TextProjection/GraphicalShellProjection/ParameterSnapshot,
        refresh PreparedGraph.initialParameters from that committed projection, publish scalar parameters,
        then stage or publish the complete graph
      - a PATCH ADSR edit during Preparing publishes against the active source revision and is included
        when the candidate's initial parameters are refreshed after commit; during Activating it publishes
        against the target revision for exact consumption on activation while the old source continues
        with its last compatible snapshot
      - if structural publication is full after commit, retain exactly one staged graph, remain Activating,
        retry on later control ticks, and reject new structural work without rollback, drop, or substitution
      - only after GraphHandoffStatus reports the target active, the source retired, and collectRetiredOnControl
        has destroyed the returned source graph may AppLoop dispatch EngineActivationAcknowledged and
        reach Ready
      - a failed, stale, mismatched, or rejected worker result publishes no graph; every owned candidate
        is destroyed on worker/control ownership and later valid input remains dispatchable
      - dispatch preserves the existing API and delegates to dispatchFrom with a stable default source;
        production adapters and demo inputs call dispatchFrom with their exact source
      - record every accepted and rejected input exactly once on the control thread; observation occurs
        after the outcome is known and never runs in the audio callback
      - on rejection perform no state serialization, parameter publication, command enqueue, or view change,
        but append one rejected EventRecord proving generation and state hash were unchanged
      - EventRejection is a nonfatal domain result for an input event; callers may report or ignore it
        but must remain able to dispatch later events
      - accepted EventRecords include the input, StateAccepted generation, snapshot hashes, parameter
        publication, projection identity, and any AudioCommand descriptor
      - accepted Midi still passes through AppState.apply and produces every generation-coherent logical
        projection, but AppLoop selects the projector's generation-only sharing path because no canonical
        parameter, selection, capability, or Patch data changed
      - currentSemanticGraphicalViewModel, currentPatchPage, and currentStateTree are derived from the
        same accepted state and projections without exposing mutable AppState
      - control-side verifiers borrow EventLog for repeated reads and clone the complete retained history
        only when an owned final report is required
      - the production window can call only dispatchAction and immutable currentGraphicalShell; diagnostic
        and verification consumers may also read currentSemanticGraphicalViewModel/currentText/currentStateTree/eventLog,
        and none receives mutable AppState
    contributesTo:
      instrument_capability_model: keeps capability-aware Patch installation and projection inside the
        existing one-way loop
      prepared_engine_rack: tags fixed parameter projections with the complete prepared graph revision
        they target without exposing graph ownership
      one_way_parameter_control: orchestrates the complete reducer-to-projection-to-audio flow
      schema_driven_patch_page: exposes immutable current-context projections after semantic page events
      asynchronous_engine_selection: coordinates request, worker outcome, reducer commit, snapshot publication,
        graph handoff, acknowledgement, and trace ordering
      soundfont_preset_selection: routes an adjacent preset intent through the identical candidate, worker,
        commit, projection, graph, acknowledgement, and trace order
      static_patch_effect: routes effect parameter edits through the canonical reducer and same latest-snapshot
        publication while structural replacements preserve effect config
      realtime_execution: uses distinct discrete/scalar, preparation-worker, and structural-ownership
        seams without moving work into the callback
      observable_demo_scene: records the production reducer's complete event/state/effect trace
      semantic_graphical_view_model: owns the only action-to-event mapping and publishes the canonical
        semantic projection after reduction
      sixteen_track_mixer_routing: routes Patch output and track edits through the normal commit-before-projection
        path
