  LiveDemoRunner:
    purpose: advance the human-observable scene on window ticks and correlate canonical control projections
      with bounded audio observations
    uses:
    - LiveDemoScene
    - LiveDemoCheckpoint
    - LiveDemoReport
    - AutomaticMidiTest
    - AppLoop
    - SemanticAction
    - AppEvent
    - EventLog
    - StateTree
    - GraphicalShellProjection
    - SemanticGraphicalViewModel
    - FocusPath
    - ReturnPath
    - ValidAction
    - ShellFrameObservation
    - EngineSelectionStatus
    - StructuralEditIntent
    - MixerTrackId
    - PatchOutput
    - MixerTrackParameter
    - MixerTrackParameters
    - MixerState
    - VoiceEnvelope
    - CapabilityDescriptor
    - GlobalParameters
    - AudioObservation
    - AudioObservationSnapshot
    operations:
      start:
        input:
          scene: LiveDemoScene
        output:
          result: Result<(), LiveDemoError>
      advance:
        input:
          elapsed: Duration
        output:
          checkpoint: Result<Option<LiveDemoCheckpoint>, LiveDemoError>
      observeShellFrame:
        input:
          observation: ShellFrameObservation
        output:
          result: Result<(), LiveDemoError>
      completedReport:
        input: {}
        output:
          report: Option<&LiveDemoReport>
    meta:
      rules:
      - start runs on the control thread after the fixture Patches, audio observation handles, bounded
        EventLog capacity, physical audio stream, and window application are prepared; it never opens
        a device or mutates canonical state
      - advance is called by the real window tick with monotonic elapsed time and never sleeps or blocks
        the UI thread; it advances AutomaticMidiTest through its existing tick operation and dispatches
        at most one due autonomous SemanticAction through AppLoop.dispatchAction or one MIDI/system AppEvent
        through dispatchFrom with EventSource::DemoScene
      - before each runner advance the owning standalone tick calls AppLoop.advanceStructural exactly
        once, allowing the injected production worker and structural coordinator to progress without blocking;
        LiveDemoRunner observes canonical results and never submits, polls, advances, joins, or owns the
        worker or a graph directly
      - before each dispatch compute the exact expected generation, selected parameter value, FocusPath,
        InteractionMode, ReturnPath, valid actions, status/errors, StateTree value, SemanticGraphicalViewModel
        value, GraphicalShellProjection value, nested TextProjection value, ParameterSnapshot value, outcome,
        and emitted effects from the captured prior canonical state and owning typed descriptors
      - for every Patch-owned envelope coverage instance, dispatch PATCH Navigate and Adjust events in
        canonical descriptor order, require the marked row and selectedLine to follow focusedControlId,
        and never expose that identifier as a mixer-track control
      - exercise Patch trim and output track only through PatchUtility, then exercise all sixteen fixed
        MixerTrackIds through MixerMain and MixerInspector; route two sounding Patches to one track before
        its Level checkpoint and prove the fader controls their combined meter/output while every unrelated
        track remains exact
      - before every accepted scalar checkpoint dispatch the plan's Patch-targeted semantic NoteOn probe
        through AppLoop, then dispatch the parameter edit on a later tick; after exact-generation capture
        and visible dwell dispatch the matching semantic NoteOff before advancing to another checkpoint,
        so sparse fixture scheduling cannot strand a predicate
      - after an accepted semantic transition or edit wait until the canonical SemanticGraphicalViewModel
        and GraphicalShellProjection have been available across a rendered frame; scalar edits additionally
        dwell at least 500 ms and wait for AudioObservation at the exact accepted ParameterSnapshot generation
        before returning one LiveDemoCheckpoint
      - observeShellFrame runs only on control ownership after the production adapter paints; it correlates
        observation generation, state hash, context, named rectangles, and labels with the canonical GraphicalShellProjection
        and credits a PATCH or MIXER shell frame only while the bounded AudioObservation reports finite
        nonzero production-path fixture output; physical composition supplies that observation from the
        device callback and the deterministic harness supplies it from the same renderer and transport
      - shell coverage is the exact five declared regions, two top-level contexts, four semantic surfaces,
        two admitted modes, two return round trips, and frozen semantic transition set compared in both
        directions; planned labels, projected geometry, helper-only result, stale frame, invalid valid-action
        set, hidden/overlapping region, or silent audio earns no credit
      - record progress only for autonomous scene dispatch, exact-generation checkpoint capture, engine
        lifecycle advancement, or completed cleanup; ten seconds without one of those milestones returns
        a typed stage-specific LiveDemoError and 120 seconds total returns a typed whole-run timeout instead
        of waiting indefinitely
      - 'audible predicates use actual finite observation fields from the physical render path: mixer/global
        edits observe their owned signal stages, ADSR edits observe envelope timing/level, and Braids
        Model/Timbre/Color observe waveform or energy; fixture timing is recorded so unrelated musical
        evolution cannot be presented as the parameter consequence'
      - a rejected event is read from the existing EventLog, leaves generation and all projections unchanged,
        emits no effects, does not close the window, and does not skip the following valid scene step
      - after scalar coverage the runner focuses the descriptor-derived SoundFont Preset row and dispatches
        one planned adjacent choice, then returns PATCH focus to Engine and dispatches the two planned
        engine adjustments through AppLoop; while SoundFont-to-Braids prepares it moves focus to the removable
        Preset row, then requires committed reducer recovery to the next surviving visible enabled sibling;
        it holds later scene actions while each request is pending and emits checkpoints only after the
        same request progresses through canonical Preparing, Activating, and Ready with exact target identities
        and increasing graph revisions
      - after each Ready acknowledgement the runner dispatches targeted semantic MIDI for the selected
        Patch and waits for a newer matching-generation finite nonzero AudioObservation before crediting
        that structural transition; labels, candidate construction, source audio, or unrelated stems cannot
        satisfy the checkpoint
      - expected and exercised editable-parameter and ordered structural-transition identifiers are each
        compared in both directions; an added, removed, duplicated, unmodified, unprojected, inaudible,
        unacknowledged, out-of-order, or unexpected item makes the report incomplete
      - completion dispatches Patch-targeted MidiMessageKind::AllNotesOff AppEvents through AppLoop for
        every installed Patch, waits for a newer AudioObservationSnapshot with zero active notes, captures
        the final EventLog and StateTree, exposes one completed LiveDemoReport, and then performs no more
        actions
      - the runner owns no window lifecycle and never requests window close itself; after completedReport
        exposes its inert final report, the owning StandaloneApplication consumes that report and requests
        close on the same window tick
      - the runner never calls AppState.apply directly, edits the immutable capability registry or Patch
        instrument config, edits a projection or report to manufacture agreement, publishes ParameterSnapshot,
        AudioCommand, or PreparedGraph directly, invokes PreparedInstrument, PreparedEngineRack, or MixEngine
        directly, writes an audio buffer, prints output, or logs from the callback
    contributesTo:
      live_observable_demo: orchestrates the paced real-window scene and returns its coherent control-side
        evidence
      one_way_parameter_control: routes autonomous actions through the same AppLoop as keyboard and fixture
        input
      realtime_execution: reads only bounded generation-tagged callback observations
      prepared_engine_rack: observes the same rack-backed renderer without receiving graph ownership or
        preparation operations
      asynchronous_engine_selection: observes both production-path replacements through canonical lifecycle,
        revision, and target-audio evidence
      soundfont_preset_selection: drives one adjacent authored preset through that same lifecycle and
        measures the exact target
      semantic_graphical_view_model: drives and observes the cumulative physical semantic focus, mode,
        surface, return, valid-action, status/error, and recovery scene
      sixteen_track_mixer_routing: drives Patch output, shared-track, six-class control, fixed-meter,
        and teardown evidence through the newest physical scene
  BehavioralMutationHarness:
    purpose: run fast verification-only healthy and single-mutant cases through the production control,
      routing, serialization, and render seams
    uses:
    - KeyboardInputTranslator
    - AppLoop
    - StateProjector
    - StateTree
    - AudioBoundary
    - AudioRenderer
    - MixEngine
    - GlobalEffectsProcessor
    - ExhaustiveGuiDemo
    operations:
      run:
        input:
          case: DroppedAdjustment | CrossTrackParameterLeak | PatchMisroute | OmittedStateTreeLeaf | DryToWetBypass
            | ZeroRenderer
          mutantEnabled: bool
        output:
          observation: BehavioralMutationObservation
          exitCode: 0 | 1
    meta:
      rules:
      - healthy and mutant executions use the same deterministic fixture, inputs, assertions, marker,
        JSON schema, and production services; the mutant execution changes exactly one named seam
      - DroppedAdjustment suppresses exactly one translated SemanticAction::Adjust before AppLoop.dispatchAction;
        it does not edit the mapped AppEvent, EventLog, or coverage report
      - CrossTrackParameterLeak applies one edited track's MixerTrackParameters to exactly one different
        MixerTrackId at the ParameterSnapshot-to-MixEngine ownership seam while accepted AppState, PatchOutput
        values, published track ids, and stems remain otherwise correct; it does not edit StateTree, EventLog,
        measured energies, or observation fields
      - PatchMisroute rewrites exactly one accepted PatchMidi command to a different installed PatchId
        at the command-routing seam before engine dispatch; it does not edit measured stems or observation
        fields
      - OmittedStateTreeLeaf removes exactly one required typed leaf while constructing the serialized
        StateTree before coverage/property discovery; it does not append a fake missing identifier after
        report construction
      - DryToWetBypass uses a nonzero dry signal as wet excitation while both supplied effect inputs are
        exactly zero at the GlobalEffectsProcessor seam; paired healthy and mutant renders begin from
        identical reset effect state, and the mutant does not edit input-energy or output-delta measurements
      - ZeroRenderer clears the caller-owned audio buffer immediately after the production AudioRenderer
        render path and before measurement; it does not override the reported peak or completion flag
      - every mutant emits exactly one schema-valid CREST_MUTATION_OBSERVATION describing actual downstream
        measurements, then exits with status 1; every matching healthy case emits the same schema and
        exits 0
      - the harness is verification-only and exposes no mutation switch, alternate engine, alternate routing
        mode, or debug behavior to the interactive crest-synth application
    contributesTo:
      observable_demo_scene: makes the exhaustive proof independently falsifiable at six production seams
      one_way_parameter_control: proves a dropped adjustment, cross-track parameter leak, and Patch MIDI
        misroute cannot masquerade as accepted behavior
      global_mix: proves cross-track leakage, dry-to-wet bypass, zeroed render output, and incorrect Patch
        routing are detected by causal measurements
      sixteen_track_mixer_routing: falsifies track-parameter isolation independently from Patch stem identity
