      op: eq
      value: 1
    - field: soundfont_catalog_entries
      op: gt
      value: 1
    - field: soundfont_catalog_order_exact
      op: eq
      value: true
    - field: fixture_preset_choices_exact
      op: eq
      value: true
    - field: callback_reachable_strings
      op: eq
      value: 0
    - field: prepared_instruments
      op: gt
      value: 1
    - field: soundfont_patches
      op: gt
      value: 0
    - field: braids_patches
      op: gt
      value: 0
    - field: alternating_capabilities
      op: eq
      value: true
    - field: active_graph_revision
      op: gt
      value: 0
    - field: presets_match
      op: eq
      value: true
    - field: distinct_patch_channels
