witnesses:
  engine_selection_workflow:
    scope: goal
    goal: select_patch_engine
    capability: asynchronous_engine_selection
    resources:
    - DescriptorDefaultConfigFactory
    - AppState
    - AppLoop
    - GraphPreparationWorker
    - DeterministicGraphPreparationWorker
    - StructuralGraphCoordinator
    - AudioRenderer
    - ExhaustiveGuiDemo
    - EngineSelectionObservation
    - EngineSelectionAcceptanceTests
    repairResources:
    - DescriptorDefaultConfigFactory
    - AppState
    - StateProjector
    - AppLoop
    - GraphPreparationWorker
    - StructuralGraphCoordinator
    - AudioRenderer
    - ExhaustiveGuiDemo
    evidence:
    - evidence.engine_selection_workflow
    command:
    - cargo
    - test
    - --test
    - engine_selection_workflow
    - --
    - --nocapture
    timeout: 180s
    observation:
      kind: json_stdout
      marker: 'CREST_ENGINE_SELECTION_OBSERVATION '
      schema:
        schemaVersion: number
        patchId: number
        sourceCapabilityId: string
        forwardCapabilityId: string
        finalCapabilityId: string
        revisions: array
        preparingSourceAudible: bool
        busyRejected: bool
        staleResultRejected: bool
        controlledFailurePreservedSource: bool
        fallbackCount: number
        graphPublications: number
        activationAcknowledgements: number
        braidsPrimaryPatchRms: number
        soundfontPrimaryPatchRms: number
        targetAudioFinite: bool
        targetedPatchExact: bool
        untargetedPatchExact: bool
        finalDescriptorDefaultSoundFont: bool
        callbackAllocations: number
        callbackDeallocations: number
        callbackDestructions: number
        retiredGraphsCollectedOffCallback: number
    predicates:
    - field: schemaVersion
      op: eq
      value: 1
    - field: sourceCapabilityId
      op: eq
      value: instrument.soundfont.hidef
    - field: forwardCapabilityId
      op: eq
      value: instrument.braids
    - field: finalCapabilityId
      op: eq
      value: instrument.soundfont.hidef
    - field: preparingSourceAudible
      op: eq
      value: true
    - field: busyRejected
      op: eq
      value: true
    - field: staleResultRejected
      op: eq
      value: true
    - field: controlledFailurePreservedSource
      op: eq
      value: true
    - field: fallbackCount
      op: eq
      value: 0
    - field: graphPublications
      op: eq
      value: 2
    - field: activationAcknowledgements
      op: eq
      value: 2
    - field: braidsPrimaryPatchRms
      op: gt
      value: 0
    - field: soundfontPrimaryPatchRms
      op: gt
      value: 0
    - field: targetAudioFinite
      op: eq
      value: true
    - field: targetedPatchExact
      op: eq
      value: true
    - field: untargetedPatchExact
      op: eq
      value: true
    - field: finalDescriptorDefaultSoundFont
      op: eq
      value: true
    - field: callbackAllocations
      op: eq
      value: 0
    - field: callbackDeallocations
      op: eq
      value: 0
    - field: callbackDestructions
      op: eq
      value: 0
    - field: retiredGraphsCollectedOffCallback
      op: eq
      value: 2
