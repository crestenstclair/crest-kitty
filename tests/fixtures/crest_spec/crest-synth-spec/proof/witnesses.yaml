        mixer_context_observed: bool
        physical_audio_nonzero: bool
        active_notes_after_cleanup: number
        window_closed: bool
        stream_released: bool
        owned_graphs_remaining: number
    predicates:
    - field: context_line_visible
      op: eq
      value: true
    - field: identity_header_visible
      op: eq
      value: true
    - field: main_workspace_visible
      op: eq
      value: true
    - field: persistent_side_region_visible
      op: eq
      value: true
    - field: footer_visible
      op: eq
      value: true
    - field: patch_context_observed
      op: eq
      value: true
    - field: mixer_context_observed
      op: eq
      value: true
    - field: physical_audio_nonzero
      op: eq
      value: true
    - field: active_notes_after_cleanup
      op: eq
      value: 0
    - field: window_closed
      op: eq
      value: true
    - field: stream_released
      op: eq
      value: true
    - field: owned_graphs_remaining
